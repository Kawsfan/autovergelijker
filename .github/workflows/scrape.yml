name: Dagelijkse Auto Scraper

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

# Zonder deze guard kan een handmatige workflow_dispatch-run (bv. om een fix
# te verifiëren) overlappen met de geplande cron-run. Beide scrapen dan
# gelijktijdig en racen om als eerste te committen+pushen, wat tot een echte
# git-mergeconflict leidt in de "Commit resultaten"-stap (gezien op 20 aug:
# CONFLICT (content) in tientallen occasions/*.html-bestanden + sitemap.xml,
# gevolgd door 3 mislukte push-pogingen). cancel-in-progress: false zodat een
# lopende run zijn scrape gewoon afmaakt -- de volgende run wacht in de rij
# i.p.v. de eerste te annuleren en scrape-resultaten te verspillen.
concurrency:
  group: scrape-workflow
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape auto listings
        run: node scripts/scrape.js

      - name: Genereer occasions pagina's
        run: node generate-occasions.js

      - name: Genereer artikelen pagina's
        run: node generate-artikelen.js

      - name: Commit resultaten
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # index.html hoort hierbij: generate-occasions.js herschrijft daar de
          # statische merken-/steden-linkblokken in (updateHomepageMerkenLinks/
          # updateHomepageStedenLinks). Stond dit lijstje niet compleet, dan
          # bleven die wijzigingen onstaged staan en faalde de "git pull
          # --rebase" verderop op elke run met "You have unstaged changes" --
          # zie ook check-scrape-health.js voor eventuele toekomstige
          # write-targets die hier ook bij moeten.
          # marktanalyse/ ontbrak hier na de introductie van buildMarktPage()
          # (PR #121) -- run #251 (12 sep) faalde daardoor 3x op exact deze
          # "unstaged changes"-fout, want generate-occasions.js schrijft ook
          # naar marktanalyse/ maar dat pad werd nooit gestaged.
          git add data/ sitemap.xml occasions/ marktanalyse/ artikelen/ llms.txt index.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen, klaar."
            exit 0
          fi
          git commit -m "Auto: listings + occasions bijgewerkt"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push poging $i mislukt, retry in 10s..."
            sleep 10
          done
          exit 1

      - name: Controleer scraper-gezondheid per bron
        run: node scripts/check-scrape-health.js

      - name: Meld gewijzigde pagina's bij IndexNow (Bing e.a.)
        # continue-on-error: dit is puur een "hé zoekmachine, kom sneller
        # langs"-melding -- als IndexNow zelf een storing heeft mag dat nooit
        # de scraperun rood laten zien, zie scripts/ping-indexnow.js.
        run: node scripts/ping-indexnow.js
        continue-on-error: true

      - name: Verstuur zoekagent-e-mailmeldingen
        # Slaat zichzelf stilletjes over zolang SUPABASE_SERVICE_ROLE_KEY/
        # RESEND_API_KEY nog niet als repo-secret zijn ingesteld (zie
        # scripts/send-notifications.js). continue-on-error zodat een losse
        # mislukte verstuurpoging (bv. Resend-rate-limit) niet de daadwerkelijke
        # scrape/deploy-run in de Actions-geschiedenis als "failed" laat zien --
        # dat signaal is voorbehouden aan de scraper-gezondheidscheck hierboven.
        run: node scripts/send-notifications.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Stuur alert bij workflow-failure
        # Draait ALLEEN als een van de vorige stappen (scrape/generate/commit/
        # gezondheidscheck) is mislukt -- if: failure() kijkt naar de status
        # van de hele job tot nu toe, dus ook als eerdere stappen om die
        # reden zijn overgeslagen. Aanleiding: op 12 sep faalde deze workflow
        # ~6 uur onopgemerkt (zie PR #125) omdat er geen enkel alarm bestond
        # op workflow-niveau -- check-scrape-health.js bewaakt alleen de
        # kwaliteit per bron, niet of de workflow zelf uitvalt. Slaat
        # zichzelf stilletjes over zolang RESEND_API_KEY/ALERT_EMAIL nog niet
        # zijn ingesteld (zie scripts/send-failure-alert.js).
        if: failure()
        run: node scripts/send-failure-alert.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
