name: Dagelijkse Auto Scraper

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape auto listings
        run: node scripts/scrape.js

      - name: Genereer occasions pagina's
        run: node generate-occasions.js

      - name: Genereer artikelen pagina's
        run: node generate-artikelen.js

      - name: Commit resultaten
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # index.html hoort hierbij: generate-occasions.js herschrijft daar de
          # statische merken-/steden-linkblokken in (updateHomepageMerkenLinks/
          # updateHomepageStedenLinks). Stond dit lijstje niet compleet, dan
          # bleven die wijzigingen onstaged staan en faalde de "git pull
          # --rebase" verderop op elke run met "You have unstaged changes" --
          # zie ook check-scrape-health.js voor eventuele toekomstige
          # write-targets die hier ook bij moeten.
          git add data/ sitemap.xml occasions/ artikelen/ llms.txt index.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen, klaar."
            exit 0
          fi
          git commit -m "Auto: listings + occasions bijgewerkt"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push poging $i mislukt, retry in 10s..."
            sleep 10
          done
          exit 1

      - name: Controleer scraper-gezondheid per bron
        run: node scripts/check-scrape-health.js
