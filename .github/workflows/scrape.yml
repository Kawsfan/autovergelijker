name: Dagelijkse Auto Scraper

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape auto listings
        run: node scripts/scrape.js

      - name: Genereer occasions pagina's
        run: node generate-occasions.js

      - name: Commit resultaten
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ sitemap.xml occasions/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen, klaar."
            exit 0
          fi
          git commit -m "Auto: listings + occasions bijgewerkt"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push poging $i mislukt, retry in 10s..."
            sleep 10
          done
          exit 1
