name: PR-validatie

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check gewijzigde .js/.json/index.html
        run: node scripts/validate.js

      - name: Unit-tests (lib/)
        # Geen pad meegeven -- "node --test test/" probeert de map als
        # module te requiren i.p.v. 'm te scannen (MODULE_NOT_FOUND, lokaal
        # ontdekt). Zonder argument gebruikt Node zijn eigen, wél werkende
        # standaard-discovery (**/*.test.js).
        run: node --test
